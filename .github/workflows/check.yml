name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and tests on all three desktop platforms (R04). The app runs in a browser and the
  # server side is any Nextcloud host, so this checks the toolchain and the code on each OS.
  check:
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners: this repo is public, and a public repo never runs on
        # self-hosted machines (the pipeline repo's R29).
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        if: runner.os != 'Windows' || runner.environment == 'github-hosted'
        with:
          php-version: '8.4'
          tools: composer

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint JavaScript and Vue
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: npm run lint:php

      - name: PHP tests
        run: npm run test:php

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build
        run: npm run build
